name: Build Stage Cue

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            id: windows-x64
            output: StageCue-Windows-x64.exe

          - name: Linux x64
            os: ubuntu-22.04
            id: linux-x64
            output: StageCue-Linux-x64

          - name: macOS Apple Silicon
            os: macos-15
            id: macos-arm64
            output: StageCue-macOS-arm64.zip

          - name: macOS Intel
            os: macos-15-intel
            id: macos-x64
            output: StageCue-macOS-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk8.6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      # -------------------------
      # Windows
      # -------------------------

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name StageCue `
            --icon "assets/stagecue.png" `
            --hidden-import "PIL" `
            --hidden-import "PIL._imagingtk" `
            --hidden-import "PIL._tkinter_finder" `
            --add-data "client_secret.json:." `
            --add-data "assets/stagecue.png:assets" `
            main.py

          Move-Item "dist/StageCue.exe" "${{ matrix.output }}"

      # -------------------------
      # Linux
      # -------------------------

      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name StageCue \
            --hidden-import "PIL" \
            --hidden-import "PIL._imagingtk" \
            --hidden-import "PIL._tkinter_finder" \
            --add-data "client_secret.json:." \
            --add-data "assets/stagecue.png:assets" \
            main.py

          mv "dist/StageCue" "${{ matrix.output }}"
          chmod +x "${{ matrix.output }}"

      # -------------------------
      # macOS
      # -------------------------

      - name: Build macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "Stage Cue" \
            --osx-bundle-identifier "tech.gjdev.stagecue" \
            --icon "assets/stagecue.png" \
            --hidden-import "PIL" \
            --hidden-import "PIL._imagingtk" \
            --hidden-import "PIL._tkinter_finder" \
            --add-data "client_secret.json:." \
            --add-data "assets/stagecue.png:assets" \
            main.py

          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            "dist/Stage Cue.app" \
            "${{ matrix.output }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stagecue-${{ matrix.id }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download compiled applications
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Verify version matches tag
        shell: bash
        run: |
          APP_VERSION=$(python -c "from version import __version__; print(__version__)")
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Application version: $APP_VERSION"
          echo "Git tag version:      $TAG_VERSION"

          if [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch."
            exit 1
          fi

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/* \
              --title "Stage Cue $GITHUB_REF_NAME" \
              --generate-notes
          fi